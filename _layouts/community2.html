<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>

  <style>
    /* [Keep all your CSS here as-is] */
    :root{--bg:#f6f7f9;--card:#ffffff;--card2:#f9fafb;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#16a34a;--warn:#ca8a04;--shadow: 0 10px 30px rgba(0,0,0,.08);--radius: 18px;--mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;--sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;}
    body{margin:0;font-family:var(--sans);background: var(--bg);color:var(--text);}
    .wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px;}
    /* ... all your other CSS ... */
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="title">{{ site.title }}</div>
          <div class="subtitle">{{ site.subtitle }}</div>
        </div>
      </div>
      <div class="pillbar">
        {% for pill in page.pills %}
        <div class="pill">{{ pill.name }}: <strong>{{ pill.value }}</strong></div>
        {% endfor %}
      </div>
    </header>

    <!-- Page content will be injected here -->
    {{ content }}

  </div>
</body>
</html>
